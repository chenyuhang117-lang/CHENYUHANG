<style>
:root{--wine:#3b080e;--red:#71111a;--red2:#a91e26;--gold:#e9bd68;--pale:#f6dfaa;--ink:#321b17;--muted:#927563;--paper:#fff9ef;--line:#ecd8ad;--green:#376d50;--shadow:0 18px 42px #30070d44}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#9c2228 0,#681119 35%,#3c090f 82%);color:var(--ink);font:15px/1.55 "Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:252px 1fr}.side{padding:25px 16px;background:linear-gradient(180deg,#38090e,#4a0c11 54%,#2d070b);border-right:1px solid #c99b4d55;color:#f7e4b9;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:8px 10px 22px;border-bottom:1px solid #d3a65355;margin-bottom:18px}.seal{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-size:21px;float:left;margin-right:11px}.brand h1{font-size:17px;line-height:1.35;margin:0;color:#ffe9b1}.brand small{color:#d2ad6a}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#eddbb8;text-align:left;padding:11px 12px;border-radius:10px;transition:.18s}.nav button:hover,.nav button.active{background:linear-gradient(100deg,#a7232a88,#bd8b3c33);color:#fff4d5}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.side-foot{position:absolute;bottom:18px;left:24px;right:20px;color:#bc9c69;font-size:12px}.main{min-width:0;padding:25px clamp(18px,3vw,48px) 50px;max-width:1680px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;color:#f9e9c5;margin-bottom:23px}.topline .eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:#ddb76a}.topline h2{margin:2px 0 0;font-size:24px;color:#fff0ce}.pill{border:1px solid #d0a65d77;background:#4f0d14aa;padding:8px 13px;border-radius:99px;font-size:13px;color:#f7e2ae}.content{display:grid;gap:17px}.hero{border:1px solid #e0bd71;border-radius:18px;padding:24px 28px;background:linear-gradient(115deg,#fff4dc,#f4dfb6 60%,#eed49c);box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:28px;top:-30px;font-size:150px;color:#d5a24718}.hero h3{margin:0 0 6px;color:#70131a;font-size:23px}.hero p{margin:0;color:#71553a;max-width:730px}.grid{display:grid;gap:15px}.grid.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--paper);border:1px solid #ddbd78;border-radius:15px;padding:18px;box-shadow:0 10px 28px #31080d24;min-width:0}.card h3,.card h4{margin:0 0 13px;color:#68131a}.card h3{font-size:17px}.card h4{font-size:15px}.kpi{background:linear-gradient(145deg,#fff9eb,#f4e0b7);border:1px solid #e3bf71;border-radius:14px;padding:17px;box-shadow:0 9px 22px #30070d25}.kpi .label{color:#806348;font-size:13px}.kpi strong{display:block;color:#8f1921;font:700 26px/1.3 Georgia,"Microsoft YaHei",serif;margin-top:7px}.kpi small{color:#8c745e}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.gold{color:#9b691b}.badge{display:inline-flex;padding:3px 9px;border-radius:99px;background:#f5e6c2;color:#77521e;font-size:12px}.badge.saved{background:#deeee0;color:#286343}.btn{border:1px solid #b78639;background:linear-gradient(135deg,#a51b24,#6d1018);color:#fff1cf;padding:9px 14px;border-radius:9px;box-shadow:0 4px 10px #5b111522}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#fff8e9;color:#71341e;border-color:#d7b875;box-shadow:none}.btn.danger{background:linear-gradient(135deg,#a51b24,#641018);border-color:#99232a}.btn.small{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:not-allowed}.field{display:grid;gap:5px;min-width:120px}.field label{font-size:12px;color:#75583d}.field input,.field select,.input{background:#fffdf8;border:1px solid #dfc992;border-radius:8px;padding:9px 10px;color:#392119;min-width:0;outline:none}.field input:focus,.field select:focus,.input:focus{border-color:#a5742e;box-shadow:0 0 0 3px #d7ac4c22}.field input[type=number]{width:100%}.toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee1c7;white-space:nowrap}th{color:#77542e;background:#fbf1da;font-weight:600}td strong{color:#811a20}.slot{border:1px solid #ead8b4;border-radius:12px;overflow:hidden;background:#fffdf8}.slot summary{cursor:pointer;padding:12px 15px;background:linear-gradient(90deg,#fff3d5,#fffaf0);font-weight:700;color:#70151b;display:flex;justify-content:space-between}.slot-body{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.segment{border:1px solid #eee1c7;border-radius:9px;padding:10px;min-width:0}.segment h4{margin:0 0 8px;font-size:13px}.records{display:grid;gap:8px}.record{border:1px solid #eee1c7;background:#fffaf0;border-radius:8px;padding:9px;font-size:12px}.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.thumb{width:58px;height:58px;object-fit:cover;border:1px solid #d5b16a;border-radius:6px;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-head,.cal-day{padding:8px;text-align:center}.cal-head{font-size:12px;color:#846640}.cal-day{border:1px solid #ecdcb9;background:#fffdf7;border-radius:8px;min-height:58px;color:#473025}.cal-day.empty{border-color:transparent;background:transparent}.cal-day.saved{background:#f6e7c4;border-color:#d8b35f;font-weight:700}.cal-day.draft{border-style:dashed}.cal-day.selected{outline:2px solid #9d2028}.cal-day span{display:block;font-size:10px;color:#966525}.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{font-family:inherit;fill:#745d43;font-size:11px}.chart .axis{stroke:#d9c9a5;stroke-width:1}.chart .bar-guest{fill:#b3262c}.chart .bar-host{fill:#d2a44e}.chart .line{fill:none;stroke:#a82028;stroke-width:3}.chart .dot{fill:#d4a346;stroke:#fff;stroke-width:2}.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:180px;height:180px}.legend{display:grid;gap:7px;font-size:12px}.legend i{width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:7px}.callout{border-left:3px solid #c79a4c;background:#fbf0d9;padding:10px 12px;color:#745939;font-size:13px;border-radius:0 8px 8px 0}.modal-back{position:fixed;inset:0;background:#1c050ad9;display:grid;place-items:center;z-index:10;padding:18px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff9ed;border:1px solid #d9b35f;border-radius:16px;padding:20px;box-shadow:var(--shadow)}.modal h3{margin:0 0 15px;color:#70151b}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.toast{position:fixed;right:20px;bottom:20px;background:#3c0a10;color:#ffe9b7;border:1px solid #dbb15e;padding:12px 16px;border-radius:10px;z-index:20;box-shadow:var(--shadow)}.empty{padding:22px;text-align:center;color:#927b62}.profile{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #eee1c7;padding:11px 0}.profile:last-child{border-bottom:0}.notice{font-size:12px;color:#7e6347}@media(max-width:1050px){.grid.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:210px 1fr}.slot-body{grid-template-columns:1fr}}@media(max-width:720px){.shell{display:block}.side{height:auto;position:relative;padding:13px}.brand{padding:4px 7px 12px;margin-bottom:8px}.side-foot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px;font-size:13px}.main{padding:18px 12px}.grid.two{grid-template-columns:1fr}.topline h2{font-size:19px}.form-grid{grid-template-columns:1fr 1fr}.hero{padding:19px}.grid.kpis{gap:9px}.kpi{padding:13px}.kpi strong{font-size:21px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><div class="seal">财</div><h1>TOP男1厅<br>财富结算中心</h1><small>直播经营 · 精准结算</small><div style="clear:both"></div></div><nav class="nav" id="nav"></nav><div class="side-foot">金账有据 · 日结月清<br>数据仅保存在此浏览器</div></aside><main class="main"><div class="topline"><div><div class="eyebrow">GOLDEN LEDGER · LOCAL EDITION</div><h2 id="pageTitle">财富总览</h2></div><div class="pill" id="todayPill"></div></div><div id="app" class="content"></div></main></div><div id="overlay"></div><div id="toast" hidden class="toast"></div>
<script>
"use strict";
const DB_NAME="top-hall-wealth-ledger",DB_VERSION=1,STORE="app",KEY="state";
const navItems=[['overview','财富总览','✧'],['daily','每日结算','◷'],['calendar','历史日历','▦'],['month','月度统计','⌁'],['year','年度统计','⌁'],['host','主播档案','♙'],['guests','嘉宾档案','♧'],['settings','系统设置与备份','⚙']];
let state=null,view='overview',selectedDate=localDate(),calYear=new Date().getFullYear(),calMonth=new Date().getMonth()+1,statYear=new Date().getFullYear(),statMonth=new Date().getMonth()+1,editorFiles=[];
function localDate(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function uuid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function freshDay(date){return {date,hostFlow:0,hostRate:Number(state.settings.hostRate)||0,hostActualUsd:null,fxSnapshot:Number(state.settings.fx)||0,savedAt:null,slots:Array.from({length:12},()=>({rounds:[]}))}}
function blankState(){return {version:1,settings:{fx:0,hostRate:0},host:{name:'TOP男1厅',identifier:'',history:[]},guests:[],days:{}}}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('此浏览器未提供 IndexedDB'));return}let req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadState(){try{let db=await openDB();let value=await new Promise((res,rej)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();if(value)return value}catch(e){console.warn('IndexedDB load failed',e)}try{let raw=localStorage.getItem('top-hall-wealth-ledger-fallback');if(raw)return JSON.parse(raw)}catch(e){}return blankState()}
let saveQueue=Promise.resolve();function persist(){saveQueue=saveQueue.then(async()=>{try{let db=await openDB();await new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});db.close()}catch(e){console.error('IndexedDB save failed',e);try{localStorage.setItem('top-hall-wealth-ledger-fallback',JSON.stringify(state));toast('IndexedDB 暂不可用，已尝试浏览器本地备用保存。')}catch(_) {toast('保存失败：浏览器存储空间不足。')}}});return saveQueue}
const num=v=>{let n=Number(v);return Number.isFinite(n)&&n>0?n:0},money=(n,d=2)=>num(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getDay(date=selectedDate){return state.days[date]||(state.days[date]=freshDay(date))}
function roundRows(day){return day.slots.flatMap((s,si)=>s.rounds.map(r=>({...r,slot:si+1})))}
function guestById(id){return state.guests.find(g=>g.id===id)}
function ensureGuest(nickname,identifier=''){let name=String(nickname||'').trim();if(!name)return null;let key=name.toLocaleLowerCase(),ident=String(identifier||'').trim();let g=ident?state.guests.find(x=>x.identifier&&x.identifier===ident):state.guests.find(x=>x.nickname.toLocaleLowerCase()===key&&!x.identifier);if(!g&&!ident)g=state.guests.find(x=>x.nickname.toLocaleLowerCase()===key);if(!g){g={id:uuid(),nickname:name,identifier:ident,rate:0,history:[]};state.guests.push(g)}else if(ident&&!g.identifier)g.identifier=ident;return g}
function calcDay(d){let rounds=roundRows(d),guestGross=rounds.reduce((a,r)=>a+num(r.flow),0),commission=rounds.reduce((a,r)=>a+num(r.flow)*.30,0),retained=rounds.reduce((a,r)=>a+num(r.flow)*.70,0),hostBase=num(d.hostFlow)+commission,hostRate=d.hostRate===null||d.hostRate===undefined?num(state.settings.hostRate):num(d.hostRate),hostUsd=d.hostActualUsd!==null&&d.hostActualUsd!==''?num(d.hostActualUsd):hostBase*hostRate/10000,guestUsd=rounds.reduce((a,r)=>a+(r.actualUsd!==null&&r.actualUsd!==''?num(r.actualUsd):num(r.flow)*.70*num(r.rate??guestById(r.guestId)?.rate??0)/10000),0),fx=d.fxSnapshot===null||d.fxSnapshot===undefined?num(state.settings.fx):num(d.fxSnapshot);return {rounds,guestGross,commission,retained,hostBase,hostRate,hostUsd,guestUsd,totalUsd:hostUsd+guestUsd,fx,hostCny:hostUsd*fx,guestCny:guestUsd*fx,totalCny:(hostUsd+guestUsd)*fx,totalFlow:num(d.hostFlow)+guestGross,budget:(num(d.hostFlow)+guestGross)*.0035*fx}}
function fmtUsd(n){return '$'+money(n)}function fmtCny(n){return '¥'+money(n)}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,3000)}
function pageTitle(){return navItems.find(x=>x[0]===view)?.[1]||''}
function go(v){view=v;render()}
function render(){document.getElementById('pageTitle').textContent=pageTitle();document.getElementById('todayPill').textContent='结算日期 · '+selectedDate;document.getElementById('nav').innerHTML=navItems.map(x=>'<button class="'+(view===x[0]?'active':'')+'" data-view="'+x[0]+'">'+x[2]+'　'+x[1]+'</button>').join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));let root=document.getElementById('app');root.innerHTML=({overview:overviewPage,daily:dailyPage,calendar:calendarPage,month:monthPage,year:yearPage,host:hostPage,guests:guestsPage,settings:settingsPage}[view])();bindPage()}
function kpi(label,value,sub=''){return '<div class="kpi"><div class="label">'+label+'</div><strong>'+value+'</strong><small>'+sub+'</small></div>'}
function savedDays(){return Object.values(state.days).filter(d=>d.savedAt).sort((a,b)=>a.date.localeCompare(b.date))}
function overviewPage(){let ds=savedDays(),latest=ds[ds.length-1],c=latest?calcDay(latest):null,month=ds.filter(d=>d.date.slice(0,7)===localDate().slice(0,7)).reduce((a,d)=>a+calcDay(d).totalUsd,0),monthCny=ds.filter(d=>d.date.slice(0,7)===localDate().slice(0,7)).reduce((a,d)=>a+calcDay(d).totalCny,0);return '<section class="hero"><h3>财源有账，经营有数</h3><p>记录 24 小时直播流水，按每位嘉宾分别核算 30% 主播抽成与 70% 嘉宾保留流水。每天保存后，经营数据进入历史统计。</p><div class="row" style="margin-top:15px"><button class="btn" data-action="go-daily">开始今日结算</button><button class="btn secondary" data-action="go-calendar">打开历史日历</button></div></section><div class="grid kpis">'+kpi('累计已保存天数',ds.length+' 天','仅包含已保存日期')+kpi('最近结算日期',latest?latest.date:'暂无','每日记录独立保存')+kpi('最近日收益',c?fmtUsd(c.totalUsd):'$0.00',c?fmtCny(c.totalCny):'¥0.00')+kpi('本月累计收益',fmtUsd(month),fmtCny(monthCny))+'</div><div class="grid two"><section class="card"><h3>最近结算</h3>'+(latest?'<div class="row between"><div><b>'+latest.date+'</b><div class="muted">主播 '+fmtUsd(calcDay(latest).hostUsd)+' · 嘉宾 '+fmtUsd(calcDay(latest).guestUsd)+'</div></div><button class="btn secondary small" data-open-date="'+latest.date+'">查看日期</button></div>':'<div class="empty">还没有已保存的结算。录入每日数据后点击「保存当日结算」。</div>')+'</section><section class="card"><h3>计算规则</h3><div class="notice">主播奖励 =（主播自身流水 + 各嘉宾流水逐条 × 30%）× 主播折算百分数 ÷ 10,000<br>嘉宾奖励 = 嘉宾流水 × 70% × 嘉宾折算百分数 ÷ 10,000<br>截图反推折算百分数 = 实际奖励美元 × 10,000 ÷ 结算基础流水；人民币收益 = 美元奖励 × 当日汇率</div></section></div><section class="card"><h3>24 小时时段流水表现</h3>'+flowChart(latest||freshDay(localDate()))+'<div class="notice">主播自身流水以独立的全日数字录入，无法在没有分时数据时分配到小节；图表单独展示主播全日流水，并按实际录入的嘉宾记录绘制 12 段。</div></section>'}
function dayTotalsForSlot(d,i){let rs=d.slots[i].rounds;return rs.reduce((a,r)=>a+num(r.flow),0)}
function flowChart(d){let W=850,H=250,left=48,right=18,top=16,bottom=43,plotH=H-top-bottom,max=Math.max(100,...d.slots.map((_,i)=>dayTotalsForSlot(d,i))),step=(W-left-right)/12,barW=Math.min(35,step*.55),svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="每日时段嘉宾流水图">';for(let k=0;k<=4;k++){let y=top+plotH*k/4,val=max*(1-k/4);svg+='<line class="axis" x1="'+left+'" x2="'+(W-right)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(left-8)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(val)+'</text>'}d.slots.forEach((s,i)=>{let x=left+i*step+step/2,guest=dayTotalsForSlot(d,i),height=guest/max*plotH;svg+='<rect class="bar-guest" x="'+(x-barW/2)+'" y="'+(top+plotH-height)+'" width="'+barW+'" height="'+height+'" rx="4"><title>第'+(i+1)+'小节：嘉宾流水 '+money(guest,0)+' 分</title></rect><text x="'+x+'" y="'+(H-20)+'" text-anchor="middle">'+String(i+1).padStart(2,'0')+'</text>'});svg+='<text x="'+(W-right-3)+'" y="'+(top+12)+'" text-anchor="end">单位：流水分</text></svg><div class="row between"><span class="badge">■ 嘉宾流水（分时实际记录）</span><span class="badge">主播自身全日流水：'+money(d.hostFlow,0)+' 分（独立录入）</span></div>';return svg}

function hostPage(){let ds=savedDays(),hostUsd=0,hostCny=0,flow=0,hostComm=0,history=[];ds.forEach(d=>{let c=calcDay(d);hostUsd+=c.hostUsd;hostCny+=c.hostCny;flow+=num(d.hostFlow);hostComm+=c.commission;history.push({date:d.date,flow:d.hostFlow,commission:c.commission,reward:c.hostUsd,rate:c.hostRate,actual:d.hostActualUsd,fx:c.fx})});return '<section class="card"><div class="row between"><div><h3>主播结算档案</h3><div class="muted">独立保存主播资料与每个日期的历史结算。</div></div><button class="btn" data-action="edit-host">编辑档案</button></div><div class="grid kpis" style="margin-top:14px">'+kpi('主播名称',esc(state.host.name),'唯一标识：'+esc(state.host.identifier||'未填写'))+kpi('主播自身累计流水',money(flow,0)+' 分','已保存日期')+kpi('累计嘉宾抽成',money(hostComm,2)+' 分','逐个嘉宾流水 × 30%')+kpi('累计主播收益',fmtUsd(hostUsd),fmtCny(hostCny))+'</div></section><section class="card"><h3>主播历史结算</h3>'+historyTable(history,true)+'</section>'}
function guestPageTotals(g){let flow=0,commission=0,retained=0,reward=0,cny=0,ratios=[],history=[];savedDays().forEach(d=>{let rs=roundRows(d).filter(r=>r.guestId===g.id);if(!rs.length)return;let gross=rs.reduce((a,r)=>a+num(r.flow),0),keep=gross*.7,usd=rs.reduce((a,r)=>a+(r.actualUsd!==null&&r.actualUsd!==''?num(r.actualUsd):num(r.flow)*.7*num(r.rate??g.rate)/10000),0),fx=calcDay(d).fx;flow+=gross;commission+=gross*.3;retained+=keep;reward+=usd;cny+=usd*fx;let base=keep,actual=rs.reduce((a,r)=>a+(r.actualUsd!==null&&r.actualUsd!==''?num(r.actualUsd):num(r.flow)*.7*num(r.rate??g.rate)/10000),0);ratios.push(base?actual*10000/base:0);history.push({date:d.date,flow:gross,commission:gross*.3,retained:keep,reward:usd,rate:base?actual*10000/base:0,cny:usd*fx})});return {flow,commission,retained,reward,cny,ratios,avgRate:ratios.length?ratios.reduce((a,b)=>a+b,0)/ratios.length:0,history}}
function guestsPage(){let gs=state.guests;return '<div class="row between"><div class="muted">按昵称自动合并；同名但不同人的嘉宾可填写不同唯一标识以区分。档案累计数据只统计已保存结算。</div><button class="btn" data-action="add-guest">＋ 新建嘉宾档案</button></div>'+ (gs.length?gs.map(g=>{let t=guestPageTotals(g);return '<section class="card"><div class="row between"><div><h3>'+esc(g.nickname)+' <span class="badge">'+esc(g.identifier||'无备注/标识')+'</span></h3><div class="muted">个人折算比例：'+money(g.rate,2)+'%</div></div><div class="row"><button class="btn secondary small" data-edit-guest="'+g.id+'">编辑档案</button><button class="btn danger small" data-delete-guest="'+g.id+'">删除档案</button></div></div><div class="grid kpis" style="margin-top:13px">'+kpi('历史流水',money(t.flow,0)+' 分','原始嘉宾流水')+kpi('主播累计抽成',money(t.commission,2)+' 分','30%')+kpi('累计保留流水',money(t.retained,2)+' 分','70%')+kpi('平台/核算奖励',fmtUsd(t.reward),fmtCny(t.cny))+'</div><div class="row" style="margin-top:10px"><span class="badge">历史平均折算比例：'+money(t.avgRate,2)+'%</span><span class="badge">历史结算：'+t.history.length+' 次</span></div><h4 style="margin-top:16px">历史结算记录</h4>'+historyTable(t.history,false)+'</section>'}).join(''):'<section class="card empty">暂无嘉宾档案。录入流水时会按昵称自动建立档案。</section>')}
function historyTable(rows,host){if(!rows.length)return '<div class="empty">暂无已保存历史。</div>';return '<div class="table-wrap"><table><thead><tr><th>日期</th><th>原始流水</th>'+(host?'<th>主播自身</th>':'<th>主播抽成</th><th>保留流水</th>')+'<th>折算比例</th><th>奖励 USD</th><th>收益 CNY</th></tr></thead><tbody>'+rows.slice().reverse().map(x=>'<tr><td>'+x.date+'</td><td>'+money(x.flow,2)+' 分</td>'+(host?'<td>'+money(x.flow,2)+' 分</td>':'<td>'+money(x.commission,2)+' 分</td><td>'+money(x.retained,2)+' 分</td>')+'<td>'+money(x.rate,2)+'%</td><td>'+fmtUsd(x.reward)+'</td><td>'+fmtCny(x.cny??x.reward*(x.fx||state.settings.fx))+'</td></tr>').join('')+'</tbody></table></div>'}
function settingsPage(){return '<section class="card"><h3>结算默认参数</h3><div class="row"><div class="field"><label>默认美元兑人民币汇率</label><input id="settingFx" type="number" min="0" step="0.0001" value="'+num(state.settings.fx)+'"></div><div class="field"><label>主播默认折算比例（%）</label><input id="settingHostRate" type="number" min="0" step="0.01" value="'+num(state.settings.hostRate)+'"></div><button class="btn" data-action="save-settings">保存参数</button></div><div class="callout" style="margin-top:13px">默认折算比例只是初始值。每日主播和每位嘉宾可分别设置折算比例；录入平台实际奖励美元后会按对应结算流水反推比例。历史结算保留保存时的人民币汇率。</div></section><section class="card"><h3>数据备份与恢复</h3><p class="muted">每日记录、嘉宾档案、结算历史和图片都保存在本浏览器 IndexedDB。本地 JSON 完整备份包含图片数据；不要清除浏览器站点数据，否则本地账本可能丢失。恢复 JSON 会替换当前全部账本。</p><div class="row"><button class="btn" data-action="export-json">导出完整 JSON 备份</button><button class="btn secondary" data-action="import-json">从 JSON 恢复</button><button class="btn secondary" data-action="export-csv">导出所有已保存日期 CSV</button><input id="restoreFile" type="file" accept="application/json,.json" hidden></div><div class="callout" style="margin-top:14px">本文件不依赖 CDN 或 OCR 服务，离线可用。截图按原图保存；大批图片可能占用较多浏览器存储空间。CSV 适合在电子表格中查看；如需保留截图，请用 JSON 完整备份。</div></section><section class="card"><h3>当前数据概况</h3><div class="row"><span class="badge">'+Object.keys(state.days).length+' 个日期草稿/记录</span><span class="badge">'+savedDays().length+' 个已保存日期</span><span class="badge">'+state.guests.length+' 个嘉宾档案</span><span class="badge">'+Object.values(state.days).reduce((n,d)=>n+roundRows(d).reduce((m,r)=>m+(r.screenshots?.length||0),0),0)+' 张截图</span></div></section>'}
function bindPage(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));document.querySelectorAll('[data-open-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.openDate;getDay();view='daily';persist().then(render)});document.querySelectorAll('[data-calendar-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.calendarDate;getDay();persist().then(()=>{view='daily';render()})});document.querySelectorAll('[data-add-record]').forEach(b=>b.onclick=()=>openRecordEditor(Number(b.dataset.addRecord),Number(b.dataset.part)));document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>openRecordEditor(Number(b.dataset.editRecord),null,b.dataset.id));document.querySelectorAll('[data-delete-record]').forEach(b=>b.onclick=()=>deleteRecord(Number(b.dataset.deleteRecord),b.dataset.id));document.querySelectorAll('[data-delete-image]').forEach(b=>b.onclick=()=>deleteImage(b.dataset.deleteImage));document.querySelectorAll('[data-view-image]').forEach(b=>b.onclick=()=>viewImage(b.dataset.viewImage));document.querySelectorAll('[data-delete-day]').forEach(b=>b.onclick=()=>deleteDay(b.dataset.deleteDay));document.querySelectorAll('[data-edit-guest]').forEach(b=>b.onclick=()=>editGuest(b.dataset.editGuest));document.querySelectorAll('[data-delete-guest]').forEach(b=>b.onclick=()=>deleteGuest(b.dataset.deleteGuest));document.querySelectorAll('[data-export-csv]').forEach(b=>b.onclick=()=>exportCSV(b.dataset.exportCsv));let date=document.getElementById('dailyDate');if(date)date.onchange=()=>{selectedDate=date.value||localDate();getDay();persist().then(render)};let cy=document.getElementById('calYear'),cm=document.getElementById('calMonth');if(cy)cy.onchange=()=>{calYear=Number(cy.value)||calYear;render()};if(cm)cm.onchange=()=>{calMonth=Number(cm.value);render()};let sy=document.getElementById('statYear'),sm=document.getElementById('statMonth');if(sy)sy.onchange=()=>{statYear=Number(sy.value)||statYear;render()};if(sm)sm.onchange=()=>{statMonth=Number(sm.value);render()};let restoreInput=document.getElementById('restoreFile');if(restoreInput)restoreInput.onchange=restoreJSON;if(view==='daily')bindLiveInputs()}
function bindLiveInputs(){['hostFlow','hostRate','hostActual','fx'].forEach(id=>{let el=document.getElementById(id);el.oninput=()=>{let d=getDay();if(id==='hostFlow')d.hostFlow=num(el.value);if(id==='hostRate')d.hostRate=num(el.value);if(id==='hostActual')d.hostActualUsd=el.value===''?null:num(el.value);if(id==='fx'){state.settings.fx=num(el.value);d.fxSnapshot=num(el.value)}refreshDayNumbers()};el.onchange=()=>persist()})}
function refreshDayNumbers(){let root=document.getElementById('app'),d=getDay(),c=calcDay(d),tiles=root.querySelectorAll('.grid.kpis .kpi');if(tiles.length>=4){tiles[0].querySelector('strong').textContent=money(c.totalFlow,0)+' 分';tiles[1].querySelector('strong').textContent=fmtUsd(c.hostUsd);tiles[1].querySelector('small').textContent=fmtCny(c.hostCny);tiles[2].querySelector('strong').textContent=fmtUsd(c.guestUsd);tiles[2].querySelector('small').textContent=fmtCny(c.guestCny);tiles[3].querySelector('strong').textContent=fmtUsd(c.totalUsd);tiles[3].querySelector('small').textContent=fmtCny(c.totalCny)}let note=root.querySelector('.callout');if(note)note.innerHTML='主播结算基础流水 <b>'+money(c.hostBase,2)+' 分</b>（自身流水 '+money(d.hostFlow,2)+' + 嘉宾抽成 '+money(c.commission,2)+'）。'+(d.hostActualUsd!==null&&d.hostActualUsd!==''?'截图反推折算比例：'+money(c.hostBase?num(d.hostActualUsd)*10000/c.hostBase:0,2)+'%。':'')+' 旧预算参考：'+fmtCny(c.budget)+'（总流水 ÷ 100 × 0.35 × 汇率；不作为实际结算规则）。'}
function action(a){if(a==='go-daily'){selectedDate=localDate();getDay();view='daily';persist().then(render)}else if(a==='go-calendar'){view='calendar';render()}else if(a==='today'){selectedDate=localDate();getDay();persist().then(render)}else if(a==='calendar-today'){calYear=new Date().getFullYear();calMonth=new Date().getMonth()+1;render()}else if(a==='save-day')saveDay();else if(a==='save-settings')saveSettings();else if(a==='export-json')exportJSON();else if(a==='import-json')document.getElementById('restoreFile').click();else if(a==='export-csv')exportCSV('all');else if(a==='edit-host')editHost();else if(a==='add-guest')editGuest(null)}
function saveDay(){let d=getDay();if(!num(document.getElementById('fx').value)){toast('请先设置大于 0 的美元兑人民币汇率。');document.getElementById('fx').focus();return}d.hostFlow=num(document.getElementById('hostFlow').value);d.hostRate=num(document.getElementById('hostRate').value);d.hostActualUsd=document.getElementById('hostActual').value===''?null:num(document.getElementById('hostActual').value);state.settings.fx=num(document.getElementById('fx').value);d.fxSnapshot=state.settings.fx;d.savedAt=new Date().toISOString();let c=calcDay(d);state.host.history=state.host.history.filter(x=>x.date!==d.date);state.host.history.push({date:d.date,flow:d.hostFlow,commission:c.commission,reward:c.hostUsd,rate:c.hostRate,actual:d.hostActualUsd,fx:c.fx});state.guests.forEach(g=>{let t=guestPageTotals(g);g.history=t.history});persist().then(()=>{toast('当日结算已保存；统计数据已更新。');render()})}
function saveSettings(){let fx=num(document.getElementById('settingFx').value),rate=num(document.getElementById('settingHostRate').value);if(!fx){toast('汇率需大于 0。');return}state.settings.fx=fx;state.settings.hostRate=rate;persist().then(()=>{toast('默认参数已保存。');render()})}
function openRecordEditor(slot,part,id){let d=getDay(),old=id?d.slots[slot].rounds.find(r=>r.id===id):null;if(id&&!old)return;editorFiles=old?(old.screenshots||[]).slice():[];let title=old?'修改流水记录':'添加嘉宾流水记录';document.getElementById('overlay').innerHTML='<div class="modal-back" data-close-bg><section class="modal"><div class="row between"><h3>'+title+' · 第 '+(slot+1)+' 小节</h3><button class="btn secondary small" data-close>关闭</button></div><div class="form-grid"><div class="field"><label>嘉宾昵称</label><input id="rName" value="'+esc(old?.nickname||'')+'"></div><div class="field"><label>唯一标识 / 备注（可选）</label><input id="rIdent" value="'+esc(old?.identifier||'')+'"></div><div class="field"><label>截图时间（人工核对）</label><input id="rTime" type="time" value="'+esc(old?.time||'')+'"></div><div class="field"><label>归属小节</label><select id="rSlot">'+d.slots.map((_,i)=>'<option value="'+i+'" '+(slot===i?'selected':'')+'>第 '+(i+1)+' 小节</option>').join('')+'</select></div><div class="field"><label>上下半小时段</label><select id="rPart"><option value="0" '+(Number(old?.part??part)===0?'selected':'')+'>上半小时段 · 第1小时</option><option value="1" '+(Number(old?.part??part)===1?'selected':'')+'>下半小时段 · 第2小时</option></select></div><div class="field"><label>流水分值</label><input id="rFlow" type="number" min="0" step="0.01" value="'+(old?.flow??'')+'"></div><div class="field"><label>嘉宾折算比例（%）</label><input id="rRate" type="number" min="0" step="0.01" value="'+(old?.rate??(guestById(old?.guestId)?.rate??0))+'"></div><div class="field"><label>平台截图实际奖励（美元，可选）</label><input id="rActual" type="number" min="0" step="0.01" placeholder="留空按折算比例" value="'+(old?.actualUsd??'')+'"></div><div class="field"><label>上传流水截图（原图）</label><input id="rImages" type="file" accept="image/*" multiple></div></div><div class="callout" style="margin:12px 0">同一嘉宾每次清零后的流水请单独新增一条，系统累加历史。图片时间请人工核对；本版本不提供 OCR 自动识别。</div><div id="editorThumbs" class="thumbs"></div><div class="row between" style="margin-top:15px"><span class="muted">截图 '+editorFiles.length+' 张 · 重复图片会提醒并跳过</span><button class="btn" data-save-record="'+slot+'" data-id="'+(id||'')+'">保存流水记录</button></div></section></div>';document.querySelector('[data-close]').onclick=closeModal;document.querySelector('[data-close-bg]').onclick=e=>{if(e.target===e.currentTarget)closeModal()};document.getElementById('rName').onchange=autofillRate;document.getElementById('rIdent').onchange=autofillRate;document.getElementById('rImages').onchange=async e=>{for(let f of Array.from(e.target.files||[])){if(!f.type.startsWith('image/'))continue;let data=await fileData(f);if(editorFiles.some(x=>x.data===data)||allImages().some(x=>x.data===data)){toast('检测到重复图片，已跳过。');continue}editorFiles.push({name:f.name,type:f.type,data,addedAt:new Date().toISOString()})}drawEditorThumbs();e.target.value=''};document.querySelector('[data-save-record]').onclick=()=>saveRecord(slot,id)}
function autofillRate(){let g=state.guests.find(x=>x.nickname.toLowerCase()===document.getElementById('rName').value.trim().toLowerCase());if(g&&!document.getElementById('rRate').dataset.changed)document.getElementById('rRate').value=g.rate}
function drawEditorThumbs(){let el=document.getElementById('editorThumbs');if(!el)return;el.innerHTML=editorFiles.map((im,i)=>'<span><img class="thumb" src="'+im.data+'"><button class="btn danger small" data-remove-editor-image="'+i+'">移除</button></span>').join('');el.querySelectorAll('[data-remove-editor-image]').forEach(b=>b.onclick=()=>{editorFiles.splice(Number(b.dataset.removeEditorImage),1);drawEditorThumbs()})}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
function allImages(){return Object.values(state.days).flatMap(d=>roundRows(d).flatMap(r=>r.screenshots||[]))}
function saveRecord(oldSlot,id){let d=getDay(),slot=Number(document.getElementById('rSlot').value),name=document.getElementById('rName').value.trim(),flow=document.getElementById('rFlow').value;if(!name){toast('请填写嘉宾昵称。');return}if(flow===''||Number(flow)<0){toast('请填写有效流水分值。');return}let g=ensureGuest(name,document.getElementById('rIdent').value.trim()),targetSlot=d.slots[slot];let unique=new Set(targetSlot.rounds.filter(r=>r.id!==id).map(r=>r.guestId||r.nickname.toLowerCase()));unique.add(g.id);if(unique.size>8){toast('该小节最多 8 位不同嘉宾。');return}let rec={id:id||uuid(),guestId:g.id,nickname:name,identifier:document.getElementById('rIdent').value.trim(),time:document.getElementById('rTime').value,part:Number(document.getElementById('rPart').value),flow:num(flow),rate:num(document.getElementById('rRate').value),actualUsd:document.getElementById('rActual').value===''?null:num(document.getElementById('rActual').value),screenshots:editorFiles};if(id){for(let s of d.slots)s.rounds=s.rounds.filter(r=>r.id!==id)}d.slots[slot].rounds.push(rec);g.rate=rec.rate;persist().then(()=>{closeModal();render();toast('流水记录已保存。')})}
function closeModal(){document.getElementById('overlay').innerHTML='';editorFiles=[]}
function deleteRecord(slot,id){if(!confirm('确定删除这条流水记录及其关联截图吗？'))return;let d=getDay();d.slots[slot].rounds=d.slots[slot].rounds.filter(r=>r.id!==id);persist().then(render)}
function deleteImage(token){let [slot,id,j]=token.split('|'),r=getDay().slots[Number(slot)].rounds.find(x=>x.id===id);if(!r||!confirm('确定删除这张截图吗？删除后无法从当前账本恢复。'))return;r.screenshots.splice(Number(j),1);persist().then(render)}
function viewImage(token){let [slot,id,j]=token.split('|'),img=getDay().slots[Number(slot)].rounds.find(x=>x.id===id)?.screenshots?.[Number(j)];if(!img)return;document.getElementById('overlay').innerHTML='<div class="modal-back" data-close-bg><section class="modal" style="width:min(1000px,100%);text-align:center"><div class="row between"><b>'+esc(img.name||'流水截图原图')+'</b><button class="btn secondary small" data-close>关闭</button></div><img src="'+img.data+'" style="max-width:100%;max-height:78vh;margin-top:12px"></section></div>';document.querySelector('[data-close]').onclick=closeModal;document.querySelector('[data-close-bg]').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
function deleteDay(date){if(!confirm('确定删除 '+date+' 的整份历史记录和所有截图吗？该操作无法撤销。'))return;delete state.days[date];persist().then(()=>{toast('历史日期已删除。');render()})}
function editHost(){let name=prompt('主播名称',state.host.name),id=prompt('主播唯一标识或备注',state.host.identifier||'');if(name===null||id===null)return;state.host.name=name.trim()||'TOP男1厅';state.host.identifier=id.trim();persist().then(render)}
function editGuest(id){let g=id?guestById(id):null,n=prompt('嘉宾昵称',g?.nickname||''),ident=prompt('唯一标识或备注',g?.identifier||'');if(n===null||ident===null)return;if(!n.trim()){toast('嘉宾昵称不能为空。');return}if(g){g.nickname=n.trim();g.identifier=ident.trim();let rate=prompt('默认折算比例（%）',g.rate);if(rate===null)return;g.rate=num(rate)}else{let created=ensureGuest(n,ident);let rate=prompt('默认折算比例（%）',created.rate);if(rate!==null)created.rate=num(rate)}persist().then(render)}
function deleteGuest(id){let g=guestById(id);if(!g)return;if(!confirm('确定删除嘉宾档案「'+g.nickname+'」？历史流水记录会保留，但该档案不再汇总。'))return;state.guests=state.guests.filter(x=>x.id!==id);persist().then(render)}
function exportJSON(){let blob=new Blob([JSON.stringify({product:'TOP男1厅 · 财富结算中心',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});download(blob,'财富结算中心-完整备份-'+localDate()+'.json');toast('完整 JSON 备份已导出（含截图）。')}
function exportCSV(scope){let ds=savedDays();if(scope==='month')ds=periodDays(statYear,statMonth);if(scope==='year')ds=ds.filter(d=>d.date.startsWith(statYear+'-'));let rows=[['日期','保存时间','主播自身流水分','嘉宾原始流水分','主播抽成分','嘉宾保留分','主播奖励USD','嘉宾奖励USD','总奖励USD','汇率','主播收益CNY','嘉宾收益CNY','总收益CNY','预算参考CNY']];ds.forEach(d=>{let c=calcDay(d);rows.push([d.date,d.savedAt,d.hostFlow,c.guestGross,c.commission,c.retained,c.hostUsd,c.guestUsd,c.totalUsd,c.fx,c.hostCny,c.guestCny,c.totalCny,c.budget])});let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'财富结算-'+scope+'-'+localDate()+'.csv')}
function download(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreJSON(e){let file=e.target.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text()),candidate=parsed.state||parsed;if(!candidate.days||!candidate.settings||!Array.isArray(candidate.guests))throw Error('格式不匹配');if(!confirm('恢复备份将替换当前全部数据，确认继续？'))return;state=candidate;await persist();toast('JSON 账本已恢复。');render()}catch(err){alert('恢复失败：'+err.message)}finally{e.target.value=''}}
window.addEventListener('beforeunload',()=>{try{localStorage.setItem('top-hall-wealth-ledger-fallback',JSON.stringify(state))}catch(e){}});
async function boot(){state=await loadState();if(!state.settings)state=blankState();if(!Array.isArray(state.guests))state.guests=[];if(!state.host)state.host={name:'TOP男1厅',identifier:'',history:[]};state.settings.fx=Number.isFinite(Number(state.settings.fx))?Number(state.settings.fx):0;state.settings.hostRate=Number.isFinite(Number(state.settings.hostRate))?Number(state.settings.hostRate):0;render()}
boot();
</script></body></html>
