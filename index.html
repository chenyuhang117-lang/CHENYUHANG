<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务中心</title>
<style>
  :root{
    --bg:#0b0e13; --bg2:#11151c; --panel:#151a22; --panel2:#1a2029;
    --line:#232a35; --text:#e9edf4; --muted:#8d97a8; --dim:#5d6778;
    --accent:#ff3b5c; --accent2:#ff7a3d; --ok:#2fd48b; --warn:#f5b942; --info:#4a9eff;
    --radius:14px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 80% -10%, #1a2230 0%, var(--bg) 55%);
    color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--info);text-decoration:none}
  button{font-family:inherit}

  /* ---------- 布局 ---------- */
  .shell{display:flex;min-height:100vh}
  aside{
    width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
    padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
  .brand .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(255,59,92,.35)}
  .brand b{font-size:15px;letter-spacing:.4px}
  nav{display:flex;flex-direction:column;gap:4px}
  nav button{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;color:var(--muted);padding:10px 12px;border-radius:10px;
    font-size:13.5px;cursor:pointer;transition:.15s;
  }
  nav button:hover{background:#1a212b;color:var(--text)}
  nav button.on{background:linear-gradient(90deg,rgba(255,59,92,.16),rgba(255,59,92,.04));color:#fff}
  nav button.on::before{content:"";width:3px;height:16px;border-radius:3px;background:var(--accent);margin-left:-12px;margin-right:9px}
  .side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
  .userbox{display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2b3546,#1a2230);display:grid;place-items:center;font-weight:600;color:#cfd8e6;font-size:13px;border:1px solid var(--line)}
  .userbox small{display:block;color:var(--dim);font-size:11px}

  main{flex:1;min-width:0;padding:22px 26px 60px}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .topbar h1{font-size:19px;margin:0;font-weight:600}
  .topbar .sub{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}

  /* ---------- 通用组件 ---------- */
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .card + .card{margin-top:16px}
  .card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h3 .tagline{font-weight:400;color:var(--dim);font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .grid.tasks{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}

  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-size:24px;font-weight:650;margin-top:4px;letter-spacing:.3px}
  .stat .v small{font-size:12px;color:var(--dim);font-weight:400}
  .stat.hot .v{color:var(--accent)}
  .stat.ok .v{color:var(--ok)}

  input,textarea,select{
    background:#0d1117;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14px;width:100%;outline:none;transition:.15s;
  }
  input:focus,textarea:focus{border-color:#3a4557;box-shadow:0 0 0 3px rgba(74,158,255,.12)}
  textarea{min-height:170px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.7}

  .btn{border:0;border-radius:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(255,59,92,.28)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:#1b222c;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{background:#212a36}
  .btn.ok{background:rgba(47,212,139,.14);color:var(--ok);border:1px solid rgba(47,212,139,.3)}
  .btn.warn{background:rgba(245,185,66,.12);color:var(--warn);border:1px solid rgba(245,185,66,.3)}
  .btn.blue{background:rgba(74,158,255,.14);color:var(--info);border:1px solid rgba(74,158,255,.3)}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#12171f}
  .pill.green{color:var(--ok);border-color:rgba(47,212,139,.35);background:rgba(47,212,139,.1)}
  .pill.amber{color:var(--warn);border-color:rgba(245,185,66,.35);background:rgba(245,185,66,.1)}
  .pill.blue{color:var(--info);border-color:rgba(74,158,255,.35);background:rgba(74,158,255,.1)}
  .pill.red{color:var(--accent);border-color:rgba(255,59,92,.35);background:rgba(255,59,92,.1)}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  th{color:var(--dim);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;letter-spacing:.3px}
  td{padding:11px 10px;border-bottom:1px solid rgba(35,42,53,.7);vertical-align:middle}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  tbody tr:last-child td{border-bottom:0}

  .score{font-weight:650;color:#ffd479}
  .level{font-weight:600;color:#8fd0ff}
  .thumb{width:118px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}

  /* 任务卡（歌手端） */
  .task{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
  .task::after{content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}
  .task.done{opacity:.62}
  .task .head{display:flex;align-items:flex-start;gap:10px}
  .task .name{font-size:15px;font-weight:650;line-height:1.35;word-break:break-word}
  .task .meta{color:var(--dim);font-size:12px}
  .task .nums{display:flex;gap:8px;flex-wrap:wrap}
  .task .actions{display:flex;gap:8px;margin-top:auto}
  .task .actions .btn{flex:1;justify-content:center}

  .empty{text-align:center;padding:40px 10px;color:var(--dim)}
  .empty .big{font-size:34px;opacity:.5;margin-bottom:8px}

  /* 进度 */
  .progress{height:8px;background:#0d1117;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .4s}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#1e2530;border:1px solid var(--line);color:var(--text);
    padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:82vw;text-align:center
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.err{border-color:rgba(255,59,92,.5);color:#ffb3c0}

  /* 登录 */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login{width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
  .login h2{margin:0 0 4px;font-size:19px}
  .login p{margin:0 0 20px;color:var(--muted);font-size:12.5px}
  .login .field{margin-bottom:12px}
  .login label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .login .btn{width:100%;justify-content:center;margin-top:6px}

  .hide{display:none!important}

  /* 手机 */
  @media (max-width:820px){
    .shell{flex-direction:column}
    aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
    .brand{padding:0 10px 0 0}
    nav{flex-direction:row}
    nav button{padding:8px 12px;white-space:nowrap}
    nav button.on::before{display:none}
    .side-foot{margin:0 0 0 auto;border:0;padding:0}
    .userbox small{display:none}
    main{padding:16px 14px 50px}
    .thumb{width:96px;height:44px}
  }
</style>
</head>
<body>

<!-- 登录 -->
<section id="view-login" class="login-wrap">
  <form class="login" id="login-form">
    <h2>任务中心</h2>
    <p>登录后领取并处理今天分配给你的目标用户</p>
    <div class="field">
      <label>邮箱</label>
      <input id="email" type="email" placeholder="name@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn primary" type="submit" id="btn-login">登录</button>
  </form>
</section>

<!-- 主界面 -->
<div class="shell hide" id="app">
  <aside>
    <div class="brand"><span class="dot"></span><b>任务中心</b></div>
    <nav id="nav">
      <button data-view="worker" class="hide">我的任务</button>
      <button data-view="board" class="hide">今日看板</button>
      <button data-view="import" class="hide">导入候选</button>
      <button data-view="users" class="hide">用户管理</button>
    </nav>
    <div class="side-foot">
      <div class="userbox">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div id="who" style="font-size:13px">-</div>
          <small id="role">-</small>
        </div>
      </div>
      <button class="btn ghost sm" id="btn-logout" style="width:100%;margin-top:10px;justify-content:center">退出</button>
    </div>
  </aside>

  <main>
    <!-- 歌手 -->
    <section id="pane-worker" class="hide">
      <div class="topbar">
        <div>
          <h1>我的任务</h1>
          <div class="sub" id="worker-sub">—</div>
        </div>
        <div class="spacer"></div>
        <button class="btn ghost sm" id="btn-refresh-worker">刷新</button>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <b style="font-size:13px">今日进度</b>
          <span class="pill blue" id="worker-count">0/0</span>
        </div>
        <div class="progress"><i id="worker-bar" style="width:0%"></i></div>
      </div>

      <div class="grid tasks" id="my-tasks" style="margin-top:14px"></div>

      <div class="card" style="margin-top:18px">
        <h3>池子里的任务 <span class="tagline">别人放弃的，先抢先得</span></h3>
        <div class="grid tasks" id="pool-tasks"></div>
      </div>
    </section>

    <!-- 看板 -->
    <section id="pane-board" class="hide">
      <div class="topbar">
        <div><h1>今日看板</h1><div class="sub">谁接了多少、完成多少</div></div>
        <div class="spacer"></div>
        <button class="btn primary" id="btn-generate">生成今日任务</button>
        <button class="btn ghost" id="btn-reload">刷新</button>
      </div>
      <div class="grid stats" id="stats-cards"></div>
      <div class="card" style="margin-top:16px">
        <h3>歌手进度</h3>
        <div style="overflow:auto">
          <table>
            <thead><tr><th>歌手</th><th>配额</th><th>已接</th><th>完成</th><th>已加上</th><th>没通过</th><th>已回复</th><th>拉黑</th></tr></thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h3>今日全部任务</h3>
        <div style="overflow:auto">
          <table>
            <thead><tr><th>昵称</th><th>房间</th><th>分值</th><th>等级</th><th>归属</th><th>状态</th><th>结果</th></tr></thead>
            <tbody id="all-tasks"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 导入 -->
    <section id="pane-import" class="hide">
      <div class="topbar"><div><h1>导入候选</h1><div class="sub">从采集结果里把目标用户导进来</div></div></div>
      <div class="card">
        <h3>粘贴名单 <span class="tagline">一行一个昵称，只同步 ID</span></h3>
        <textarea id="import-text" placeholder="月莹
小张
𝓧.予禾"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="btn-import">导入</button>
          <span class="pill" id="import-count">待导入 0 行</span>
        </div>
      </div>
    </section>

    <!-- 用户 -->
    <section id="pane-users" class="hide">
      <div class="topbar"><div><h1>用户管理</h1><div class="sub">新建歌手账号、调整每天的任务数</div></div></div>

      <div class="card">
        <h3>新建歌手</h3>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
          <div>
            <label class="sub" style="display:block;margin-bottom:6px">登录邮箱</label>
            <input id="new-email" type="email" placeholder="singer1@task.local">
          </div>
          <div>
            <label class="sub" style="display:block;margin-bottom:6px">初始密码</label>
            <input id="new-password" type="text" placeholder="至少 6 位">
          </div>
          <div>
            <label class="sub" style="display:block;margin-bottom:6px">每天任务数</label>
            <input id="new-quota" type="number" min="0" value="10">
          </div>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="btn primary" id="btn-create-user">创建账号</button>
          <span class="sub" style="color:var(--dim);font-size:12px">建好后把邮箱和密码发给歌手即可登录</span>
        </div>
      </div>

      <div class="card">
        <h3>所有账号</h3>
        <div style="overflow:auto">
          <table>
            <thead><tr><th>用户名</th><th>角色</th><th>每日配额</th><th></th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n === null || n === undefined || n === '') ? '-' : Number(n).toLocaleString();
const today = () => new Date().toLocaleDateString('sv-SE');

const sb = supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true}});
let me = null;

function toast(msg, isErr=false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2600);
}

function statusPill(s) {
  const map = {
    accepted: ['进行中', 'blue'],
    done: ['已完成', 'green'],
    pool: ['待抢', 'amber'],
    rejected: ['已放弃', 'red']
  };
  const [t, c] = map[s] || [s, ''];
  return `<span class="pill ${c}">${t}</span>`;
}

function parseScore(text) {
  if (!text) return 0;
  const m = String(text).trim().match(/^(\d+(?:\.\d+)?)\s*([KMkm]?)$/);
  if (!m) return 0;
  const v = parseFloat(m[1]);
  const u = (m[2] || '').toUpperCase();
  return u === 'K' ? v * 1000 : u === 'M' ? v * 1e6 : v;
}

// ---------------- 登录 ----------------
$('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { toast('请填写邮箱和密码', true); return; }
  $('btn-login').disabled = true;
  const {error} = await sb.auth.signInWithPassword({email, password});
  $('btn-login').disabled = false;
  if (error) { toast('登录失败：' + error.message, true); return; }
  boot();
};

$('btn-logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { $('view-login').classList.remove('hide'); $('app').classList.add('hide'); return; }

  const {data} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  const email = session.user.email || '';
  me = data || {id: session.user.id, username: email.split('@')[0], role: 'worker', quota: 10};

  $('view-login').classList.add('hide');
  $('app').classList.remove('hide');
  $('who').textContent = me.username || '我';
  $('role').textContent = me.role === 'admin' ? '管理员' : `歌手 · 每日 ${me.quota} 条`;
  $('avatar').textContent = (me.username || '我').slice(0, 1).toUpperCase();

  // 按角色显示菜单
  const isAdmin = me.role === 'admin';
  document.querySelectorAll('#nav button').forEach(btn => {
    const v = btn.dataset.view;
    const show = isAdmin ? ['board','import','users'].includes(v) : v === 'worker';
    btn.classList.toggle('hide', !show);
  });

  if (isAdmin) switchView('board');
  else switchView('worker');
}

function switchView(name) {
  ['worker','board','import','users'].forEach(v => $('pane-' + v).classList.add('hide'));
  $('pane-' + name).classList.remove('hide');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  if (name === 'worker') loadWorker();
  if (name === 'board') loadBoard();
  if (name === 'users') loadUsers();
}

$('nav').onclick = (e) => {
  const btn = e.target.closest('button[data-view]');
  if (btn) switchView(btn.dataset.view);
};

// ---------------- 歌手 ----------------
async function loadWorker() {
  const {data: mine, error} = await sb.from('tasks').select('*')
    .eq('assigned_to', me.id).eq('work_date', today())
    .order('score_value', {ascending: false});
  if (error) { toast(error.message, true); return; }

  const list = mine || [];
  const done = list.filter(t => t.status === 'done').length;
  const total = Math.max(me.quota || 10, list.length);
  $('worker-count').textContent = `${done}/${total}`;
  $('worker-bar').style.width = Math.min(100, total ? (done / total) * 100 : 0) + '%';
  $('worker-sub').textContent = list.length ? `今天 ${list.length} 条 · 已完成 ${done} 条` : '今天还没有分配任务';

  $('my-tasks').innerHTML = list.length ? list.map(taskCard).join('') : `
    <div class="empty" style="grid-column:1/-1">
      <div class="big">🗂</div>
      今天还没有任务，等管理员分配
    </div>`;

  bindTaskActions();

  const {data: pool} = await sb.from('tasks').select('*')
    .eq('status', 'pool').is('assigned_to', null)
    .order('score_value', {ascending: false}).limit(30);

  $('pool-tasks').innerHTML = (pool && pool.length) ? pool.map(t => `
    <div class="task">
      <div class="head"><div style="flex:1">
        <div class="name">${esc(t.nickname)}</div>
        ${t.room ? `<div class="meta">${esc(t.room)}</div>` : ''}
      </div></div>
      <div class="nums">
        ${t.score ? `<span class="pill amber">分值 ${esc(t.score)}</span>` : ''}
        ${t.level ? `<span class="pill blue">L${t.level}</span>` : ''}
      </div>
      <div class="actions"><button class="btn blue sm" data-claim="${t.id}">抢这条</button></div>
    </div>`).join('') : `<div class="empty" style="grid-column:1/-1"><div class="big">🫧</div>池子是空的</div>`;

  $('pool-tasks').querySelectorAll('button[data-claim]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      const {error} = await sb.rpc('claim_task', {p_task: Number(btn.dataset.claim)});
      btn.disabled = false;
      if (error) toast(error.message, true);
      else toast('抢到了');
      loadWorker();
    };
  });
}

function taskCard(t) {
  const done = t.status === 'done';
  return `
  <div class="task ${done ? 'done' : ''}">
    <div class="head">
      <div style="flex:1">
        <div class="name">${esc(t.nickname)}</div>
        ${t.room ? `<div class="meta">${esc(t.room)}</div>` : ''}
      </div>
      ${statusPill(t.status)}
    </div>
    <div class="nums">
      ${t.score ? `<span class="pill amber">分值 ${esc(t.score)}</span>` : ''}
      ${t.level ? `<span class="pill blue">L${t.level}${t.usd ? ` · $${fmt(t.usd)}` : ''}</span>` : ''}
    </div>
    ${t.shot ? `<img class="thumb" src="${esc(t.shot)}" onclick="window.open('${esc(t.shot)}','_blank')" title="点开看榜单截图">` : ''}
    <div class="actions">
      ${done ? `<span class="pill green" style="flex:1;justify-content:center">${esc(t.result || '已完成')}</span>`
             : `<button class="btn ok sm" data-done="${t.id}">完成</button>
                <button class="btn warn sm" data-drop="${t.id}">暂时不接</button>`}
      <button class="btn ghost sm" data-copy="${esc(t.nickname)}" title="复制昵称">复制</button>
    </div>
  </div>`;
}

function bindTaskActions() {
  $('my-tasks').querySelectorAll('button[data-done]').forEach(btn => {
    btn.onclick = () => markDone(Number(btn.dataset.done));
  });
  $('my-tasks').querySelectorAll('button[data-drop]').forEach(btn => {
    btn.onclick = async () => {
      const {error} = await sb.rpc('release_task', {p_task: Number(btn.dataset.drop)});
      if (error) toast(error.message, true); else toast('已放回池子');
      loadWorker();
    };
  });
  $('my-tasks').querySelectorAll('button[data-copy]').forEach(btn => {
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(btn.dataset.copy); toast('昵称已复制'); }
      catch { toast('复制失败，请手动选中', true); }
    };
  });
}

async function markDone(id) {
  const pick = prompt('选择结果：\n1 = 已加上\n2 = 没通过\n3 = 已回复\n4 = 拉黑');
  const map = {'1':'已加上','2':'没通过','3':'已回复','4':'拉黑'};
  const result = map[String(pick || '').trim()];
  if (!result) return;
  const {error} = await sb.from('tasks')
    .update({status: 'done', result, done_at: new Date().toISOString()})
    .eq('id', id);
  if (error) toast(error.message, true); else toast('已标记完成');
  loadWorker();
}

// ---------------- 管理员 ----------------
async function loadBoard() {
  const {data: stats, error} = await sb.from('daily_stats').select('*');
  if (error) toast(error.message, true);

  const rows = stats || [];
  const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
  $('stats-cards').innerHTML = `
    <div class="stat"><div class="k">歌手</div><div class="v">${rows.length}<small> 人</small></div></div>
    <div class="stat"><div class="k">已分配</div><div class="v">${sum('taken')}<small> 条</small></div></div>
    <div class="stat ok"><div class="k">已完成</div><div class="v">${sum('done')}<small> 条</small></div></div>
    <div class="stat hot"><div class="k">已加上</div><div class="v">${sum('已加上')}<small> 人</small></div></div>`;

  $('stats-body').innerHTML = rows.map(r => `
    <tr>
      <td>${esc(r.username || '-')}</td>
      <td>${r.quota ?? '-'}</td>
      <td>${r.taken ?? 0}</td>
      <td class="score">${r.done ?? 0}</td>
      <td>${r['已加上'] ?? 0}</td>
      <td>${r['没通过'] ?? 0}</td>
      <td>${r['已回复'] ?? 0}</td>
      <td>${r['拉黑'] ?? 0}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="empty">还没有歌手账号</td></tr>';

  const {data: tasks} = await sb.from('tasks').select('*')
    .eq('work_date', today()).order('id', {ascending: false}).limit(300);
  const {data: profs} = await sb.from('profiles').select('id,username');
  const nameOf = {};
  (profs || []).forEach(p => nameOf[p.id] = p.username);

  $('all-tasks').innerHTML = (tasks || []).map(t => `
    <tr>
      <td>${esc(t.nickname)}</td>
      <td style="color:var(--dim)">${esc(t.room || '-')}</td>
      <td class="score">${esc(t.score || '-')}</td>
      <td class="level">${t.level ? 'L' + t.level : '-'}</td>
      <td style="color:var(--dim)">${esc(nameOf[t.assigned_to] || '池子')}</td>
      <td>${statusPill(t.status)}</td>
      <td>${esc(t.result || '-')}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="empty">今天还没有任务</td></tr>';
}

$('btn-reload').onclick = loadBoard;
$('btn-refresh-worker').onclick = loadWorker;

$('btn-generate').onclick = async () => {
  $('btn-generate').disabled = true;
  const {data, error} = await sb.rpc('generate_daily_tasks');
  $('btn-generate').disabled = false;
  if (error) toast(error.message, true);
  else toast(`已生成 ${data} 条任务`);
  loadBoard();
};

// 导入
$('import-text').oninput = () => {
  const n = $('import-text').value.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith('#')).length;
  $('import-count').textContent = `待导入 ${n} 行`;
};

$('btn-import').onclick = async () => {
  const text = $('import-text').value.trim();
  if (!text) { toast('先粘贴内容', true); return; }
  const rows = [];
  const seen = new Set();
  for (const line of text.split(/\r?\n/)) {
    // 只取第一列当昵称，后面的分值和来源一律忽略
    const name = line.split('|')[0].trim();
    if (!name || name.startsWith('#')) continue;
    if (seen.has(name)) continue;
    seen.add(name);
    rows.push({nickname: name, room: '', score: '', score_value: 0, level: 0, shot: ''});
  }
  if (!rows.length) { toast('没解析出内容', true); return; }
  const {error} = await sb.from('candidates').upsert(rows, {onConflict: 'nickname,room', ignoreDuplicates: true});
  if (error) toast(error.message, true);
  else { toast(`导入 ${rows.length} 条`); $('import-text').value = ''; $('import-count').textContent = '待导入 0 行'; }
};

$('btn-create-user').onclick = async () => {
  const email = $('new-email').value.trim();
  const password = $('new-password').value;
  const quota = Number($('new-quota').value) || 10;
  if (!email || !password) { toast('邮箱和密码都要填', true); return; }
  if (password.length < 6) { toast('密码至少 6 位', true); return; }
  $('btn-create-user').disabled = true;
  const {error} = await sb.rpc('create_worker', {
    p_email: email, p_password: password, p_quota: quota
  });
  $('btn-create-user').disabled = false;
  if (error) { toast(error.message, true); return; }
  toast(`已创建 ${email}（每天 ${quota} 条）`);
  $('new-email').value = '';
  $('new-password').value = '';
  loadUsers();
};

// 用户
async function loadUsers() {
  const {data} = await sb.from('profiles').select('*').order('created_at');
  $('users-body').innerHTML = (data || []).map(p => `
    <tr>
      <td>${esc(p.username || '-')}</td>
      <td>${p.role === 'admin' ? '<span class="pill red">管理员</span>' : '<span class="pill">歌手</span>'}</td>
      <td style="max-width:130px"><input type="number" min="0" value="${p.quota ?? 10}" data-quota="${p.id}"></td>
      <td><button class="btn ghost sm" data-save="${p.id}">保存</button></td>
    </tr>`).join('') || '<tr><td colspan="4" class="empty">还没有账号</td></tr>';

  $('users-body').querySelectorAll('button[data-save]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.save;
      const input = $('users-body').querySelector(`input[data-quota="${id}"]`);
      const {error} = await sb.from('profiles').update({quota: Number(input.value) || 0}).eq('id', id);
      if (error) toast(error.message, true); else toast('已保存');
    };
  });
}

boot();
</script>
</body>
</html>
